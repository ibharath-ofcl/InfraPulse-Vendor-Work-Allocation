spring:
  application:
    name: InfraPulse AI
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:infrapulse_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:50MB}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

security:
  jwt:
    secret: ${INFRAPULSE_JWT_SECRET:infrapulse-super-secure-production-jwt-signing-secret-key-256-bits-minimum!}
    access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000} # 15 minutes
    refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000} # 7 days
    issuer: InfraPulse AI
  bootstrap:
    admin-email: ${INFRAPULSE_ADMIN_EMAIL:admin@infrapulse.gov.in}
    admin-password: ${INFRAPULSE_ADMIN_PASSWORD:Admin@InfraPulse2025!}
    admin-name: ${INFRAPULSE_ADMIN_NAME:Platform Administrator}

evidence:
  storage:
    provider: ${EVIDENCE_STORAGE_PROVIDER:LOCAL}
    local-dir: ${EVIDENCE_LOCAL_DIR:uploads/evidence}
  validation:
    max-file-size: 10485760 # 10MB
    max-files-per-request: 10
    min-dimension: 50
    max-dimension: 8000
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
