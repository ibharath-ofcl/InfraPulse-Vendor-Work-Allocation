spring:
  application:
    name: InfraPulse AI Test
  datasource:
    url: jdbc:h2:mem:infrapulse_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SEQUENCE IF NOT EXISTS work_assignment_seq START WITH 1001\;CREATE SEQUENCE IF NOT EXISTS work_evidence_seq START WITH 1001\;CREATE SEQUENCE IF NOT EXISTS ai_inference_seq START WITH 1001\;CREATE SEQUENCE IF NOT EXISTS quality_assessment_seq START WITH 1001\;CREATE SEQUENCE IF NOT EXISTS human_review_seq START WITH 1001\;CREATE SEQUENCE IF NOT EXISTS corrective_action_seq START WITH 1001\;CREATE SEQUENCE IF NOT EXISTS measurement_seq START WITH 1001;
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

server:
  port: 0

cors:
  allowed-origins: "*"

security:
  jwt:
    secret: test-jwt-secret-key-for-unit-testing-purposes-must-be-256-bits-long!
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
    issuer: InfraPulse AI Test
  bootstrap:
    admin-email: admin@infrapulse.gov.in
    admin-password: Admin@InfraPulse2025!
    admin-name: Platform Administrator

evidence:
  storage:
    provider: LOCAL
    local-dir: target/test-uploads/evidence
  validation:
    max-file-size: 10485760
    max-files-per-request: 10
    min-dimension: 50
    max-dimension: 8000
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp

ai:
  service:
    url: http://localhost:8000
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
