# ==============================================================================
# InfraPulse AI — Production Docker Compose Orchestration (docker-compose.prod.yml)
# ==============================================================================
# Architecture:
# - Only the Nginx Frontend container exposes public ports (80/443).
# - Backend, AI Vision Service, and PostgreSQL communicate strictly across an
#   isolated, private container bridge network (`infrapulse-prod-net`).
# - Persistent volumes are mounted for PostgreSQL data and evidence image files.
# - Explicit CPU/Memory resource constraints and log file rotation policies are enforced.
# ==============================================================================

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: infrapulse-prod-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-infrapulse_db}
      POSTGRES_USER: ${DB_USER:-infrapulse_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password is mandatory in production}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-infrapulse_app} -d ${DB_NAME:-infrapulse_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - infrapulse-prod-net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: infrapulse-prod-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-infrapulse_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-infrapulse_app}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://infrapulse.yourdomain.gov}
      INFRAPULSE_JWT_SECRET: ${INFRAPULSE_JWT_SECRET:?JWT secret is mandatory in production}
      INFRAPULSE_ADMIN_EMAIL: ${INFRAPULSE_ADMIN_EMAIL:-admin@infrapulse.gov.in}
      INFRAPULSE_ADMIN_PASSWORD: ${INFRAPULSE_ADMIN_PASSWORD}
      INFRAPULSE_ADMIN_NAME: ${INFRAPULSE_ADMIN_NAME:-Platform Administrator}
      EVIDENCE_STORAGE_PROVIDER: LOCAL
      EVIDENCE_LOCAL_DIR: /app/uploads/evidence
      AI_SERVICE_URL: http://ai-service:8000
    volumes:
      - evidence_prod_data:/app/uploads/evidence
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - infrapulse-prod-net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: infrapulse-prod-ai-service
    restart: always
    environment:
      PORT: 8000
      ENVIRONMENT: production
      CORS_ALLOWED_ORIGINS: "http://backend:8080,http://frontend:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - infrapulse-prod-net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: infrapulse-prod-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - infrapulse-prod-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

networks:
  infrapulse-prod-net:
    driver: bridge

volumes:
  postgres_prod_data:
    driver: local
  evidence_prod_data:
    driver: local
