# InfraPulse AI - Local Development & Production Docker Compose Configuration
services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: infrapulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-infrapulse_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-infrapulse_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - infrapulse-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: infrapulse-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-infrapulse_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173,http://localhost:80"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - infrapulse-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: infrapulse-ai-service
    restart: unless-stopped
    environment:
      PORT: 8000
      ENVIRONMENT: development
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173,http://localhost:8080"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - infrapulse-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: infrapulse-frontend
    restart: unless-stopped
    depends_on:
      - backend
      - ai-service
    ports:
      - "3000:80"
    networks:
      - infrapulse-network

networks:
  infrapulse-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
